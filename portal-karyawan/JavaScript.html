//======================================
// HELPER: LOCALSTORAGE WRAPPERS (Mencegah Crash jika Iframe Sandbox memblokir Storage)
//======================================
function getStorageItem(key) {
    try {
        return localStorage.getItem(key);
    } catch (e) {
        console.warn("Storage tidak diizinkan oleh browser/iframe sandbox:", e);
        return null;
    }
}

function setStorageItem(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch (e) {
        console.warn("Storage tidak diizinkan oleh browser/iframe sandbox:", e);
    }
}

function removeStorageItem(key) {
    try {
        localStorage.removeItem(key);
    } catch (e) {
        console.warn("Storage tidak diizinkan oleh browser/iframe sandbox:", e);
    }
}

//======================================

window.onload = function () {
    var nidInput = document.getElementById("nid");
    if (nidInput) {

            if(e.key === "Enter") {
                cariData();
            }
        });
    }

    // Periksa apakah ada NID yang tersimpan di localStorage dari pencarian sebelumnya secara aman
    var lastNid = getStorageItem("lastNid");
    if (lastNid) {
        document.getElementById("nid").value = lastNid;
        cariData();
    }
};

//======================================
// CARI DATA KARYAWAN
//======================================
var googleLoadRetries = 0;
function cariData() {
    var nid = document.getElementById("nid").value.trim();
    if(nid == "") {
        alert("Silakan masukkan NID.");
        document.getElementById("nid").focus();
        return;
    }

    document.getElementById("loading").style.display = "flex";
    document.getElementById("profileArea").style.display = "none";
    document.getElementById("hasil").innerHTML = "";

    // PENCEGAHAN RACE CONDITION: Tunggu hingga API SDK Google Apps Script selesai dimuat
    if (typeof google === "undefined" || !google.script || !google.script.run) {
        googleLoadRetries++;
        if (googleLoadRetries > 25) { // Batasi maksimal 5 detik (25 * 200ms)
            document.getElementById("loading").style.display = "none";
            alert("Gagal memuat Google Apps Script API.\n\nPastikan Anda membuka halaman ini via URL Web App deployment resmi, bukan dari double-click file HTML lokal.");
            googleLoadRetries = 0;
            return;
        }
        setTimeout(cariData, 200);
        return;
    }
    googleLoadRetries = 0;

    // Panggil fungsi Apps Script backend
    google.script.run
        .withSuccessHandler(showResult)
        .withFailureHandler(function(err) {
            document.getElementById("loading").style.display = "none";
            alert("Terjadi kegagalan koneksi: " + err);
        })
        .cariDataKaryawan(nid);
}

//======================================
// FUNGSI PENGISI TABEL (Dinamis & Terstruktur)
//======================================
function populateTable(tableId, keys, data) {
    var table = document.getElementById(tableId);
    if (!table) return;
    table.innerHTML = "";

    keys.forEach(function(key) {
        var val = data[key];
        if (val === undefined || val === null) val = "-";

        // Render khusus sisa cuti dalam bentuk progress bar
        if (key === "SISA CUTI") {
            var cutiVal = parseInt(val) || 0;
            var percent = Math.min(100, Math.max(0, (cutiVal / 12) * 100)); // Asumsi jatah tahunan 12 hari
            val = 
                '<div class="cuti-container">' +
                    '<span class="cuti-text">' + cutiVal + ' Hari</span>' +
                    '<div class="progress-bar-bg">' +
                        '<div class="progress-bar-fill" style="width: ' + percent + '%;"></div>' +
                    '</div>' +
                '</div>';
        }
        // Render Badge Status berwarna jika sesuai
        else if (key === "STATUS KARYAWAN" || key === "STATUS PERKAWINAN" || key === "KETERANGAN" || key === "TANGGAL RESIGN" || key === "STATUS KONTRAK (ORGANIK/PKWT/OJT/TUGAS KARYA)") {
            val = getBadgeHtml(val);
        }

        var tr = document.createElement("tr");
        tr.innerHTML = '<td>' + key + '</td><td>' + val + '</td>';
        table.appendChild(tr);
    });
}

//======================================
// FORMAT BADGE STATUS
//======================================
function getBadgeHtml(val) {
    if (!val || val === "-") return "-";
    var cleanVal = val.toString().toUpperCase().trim();

    if (cleanVal === "ORGANIK" || cleanVal === "AKTIF" || cleanVal === "MENIKAH" || cleanVal === "KAWIN") {
        return '<span class="pill-badge badge-green">' + val + '</span>';
    } else if (cleanVal === "PENDING" || cleanVal === "KONTRAK" || cleanVal === "BELUM KAWIN") {
        return '<span class="pill-badge badge-blue">' + val + '</span>';
    } else if (cleanVal === "TIDAK AKTIF" || cleanVal === "RESIGN" || cleanVal === "DITOLAK") {
        return '<span class="pill-badge badge-red">' + val + '</span>';
    }
    return '<span class="pill-badge badge-gray">' + val + '</span>';
}

//======================================
// CONVERT LINK GOOGLE DRIVE KE DIRECT CDN
//======================================
function konversiLinkDrive(url) {
    if (!url) return "";
    var idDrive = "";
    
    // Pola 1: https://drive.google.com/file/d/ID_FILE/view?usp=sharing
    if (url.indexOf("drive.google.com/file/d/") !== -1) {
        idDrive = url.split("drive.google.com/file/d/")[1].split("/")[0];
    }
    // Pola 2: https://drive.google.com/open?id=ID_FILE
    else if (url.indexOf("drive.google.com/open?id=") !== -1) {
        idDrive = url.split("drive.google.com/open?id=")[1].split("&")[0];
    }
    // Pola 3: Google User Content CDN
    else if (url.indexOf("googleusercontent.com") !== -1) {
        return url;
    }
    else {
        return url; // Kembalikan link apa adanya jika bukan link Drive
    }
    
    return "https://lh3.googleusercontent.com/d/" + idDrive;
}

//======================================
// PERIKSA ULANG TAHUN KARYAWAN
//======================================
function checkBirthday(birthDateStr) {
    var banner = document.getElementById("birthdayBanner");
    if (!birthDateStr) {
        banner.style.display = "none";
        return;
    }

    try {
        var parts = birthDateStr.split("-");
        if (parts.length < 3) {
            banner.style.display = "none";
            return;
        }

        var birthMonth = parseInt(parts[1]) - 1; // 0-based month
        var birthDay = parseInt(parts[2]);

        var today = new Date();
        if (today.getMonth() === birthMonth && today.getDate() === birthDay) {
            banner.style.display = "flex";
        } else {
            banner.style.display = "none";
        }
    } catch (e) {
        banner.style.display = "none";
    }
}

function bukaModalCuti() {
    if (!globalNid) {

        return;
    }

    document.getElementById("cutiNid").value = globalNid;
    document.getElementById("cutiNama").value = globalNama;
    document.getElementById("cutiSisa").value = globalSisaCuti;
    
    // Reset form
    document.getElementById("cutiJenis").selectedIndex = 0;
    document.getElementById("cutiMulai").value = "";
    document.getElementById("cutiSelesai").value = "";
    document.getElementById("cutiDurasi").value = "";
    document.getElementById("cutiAlasan").value = "";
    
    cekKuotaForm();
    
    document.getElementById("modalCuti").style.display = "flex";
}

//======================================
// TUTUP MODAL CUTI
//======================================
function tutupModalCuti() {
    document.getElementById("modalCuti").style.display = "none";
}

function cekKuotaForm() {
    var jenis = document.getElementById("cutiJenis").value;
    var groupSisaCuti = document.getElementById("groupSisaCuti");
    
    if (jenis === "Cuti Tahunan") {
        groupSisaCuti.style.visibility = "visible";
    } else {
        groupSisaCuti.style.visibility = "hidden";
    }
}

//======================================
// HITUNG HARI CUTI OTOMATIS
//======================================
function hitungHariCuti() {
    var tglMulaiVal = document.getElementById("cutiMulai").value;
    var tglSelesaiVal = document.getElementById("cutiSelesai").value;
    var durasiInput = document.getElementById("cutiDurasi");
    
    if (tglMulaiVal && tglSelesaiVal) {
        var tglMulai = new Date(tglMulaiVal);
        var tglSelesai = new Date(tglSelesaiVal);
        
        if (tglSelesai < tglMulai) {
            alert("Tanggal Selesai tidak boleh mendahului Tanggal Mulai.");
            document.getElementById("cutiSelesai").value = "";
            durasiInput.value = "";
            return;
        }
        
        // Selisih hari (+1 agar hari mulai dihitung)
        var diffTime = Math.abs(tglSelesai - tglMulai);
        var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        
        durasiInput.value = diffDays;
    } else {
        durasiInput.value = "";
    }
}

//======================================
// SUBMIT PENGAJUAN CUTI & IZIN
//======================================
function kirimFormCuti(event) {
    event.preventDefault();
    
    var nid = document.getElementById("cutiNid").value;
    var jenisForm = document.getElementById("cutiJenis").value;
    var tanggalMulai = document.getElementById("cutiMulai").value;
    var tanggalSelesai = document.getElementById("cutiSelesai").value;
    var jumlahHari = parseInt(document.getElementById("cutiDurasi").value) || 0;
    var alasan = document.getElementById("cutiAlasan").value.trim();
    
    if (jenisForm === "Cuti Tahunan" && jumlahHari > globalSisaCuti) {
        alert("Kuota Jatah Cuti Anda tidak mencukupi untuk pengajuan sebanyak " + jumlahHari + " hari.");
        return;
    }
    
    var btn = document.getElementById("btnSubmitCuti");
    btn.disabled = true;
    btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Menyimpan...";
    
    // Kirim data ke Apps Script backend
    google.script.run
        .withSuccessHandler(function(response) {
            btn.disabled = false;
            btn.innerText = "Simpan Pengajuan";
            
            if (response.success) {
                // Tampilkan Modal Preview Surat Resmi dan bagikan
                bukaModalPreviewSurat(response.data);
                tutupModalCuti();
                cariData(); // Cari ulang data untuk menyegarkan database & riwayat cuti
            } else {
                alert(response.message);
            }
        })
        .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerText = "Simpan Pengajuan";
            alert("Gagal memproses pengajuan: " + err);
        })
        .kirimPengajuanCuti({
            nid: nid,
            jenisForm: jenisForm,
            tanggalMulai: tanggalMulai,
            tanggalSelesai: tanggalSelesai,
            jumlahHari: jumlahHari,
            alasan: alasan
        });
}

function salinTeksKeClipboard(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            alert(successMsg);
        }, function(err) {
            fallbackCopyText(text, successMsg);
        });
    } else {
        fallbackCopyText(text, successMsg);
    }
}

function fallbackCopyText(text, successMsg) {
    var tempTextArea = document.createElement("textarea");
    tempTextArea.value = text;
    tempTextArea.style.top = "0";
    tempTextArea.style.left = "0";
    tempTextArea.style.position = "fixed";
    document.body.appendChild(tempTextArea);
    tempTextArea.focus();
    tempTextArea.select();
    try {
        var successful = document.execCommand('copy');
        if (successful) {
            alert(successMsg);
        } else {
            alert("Gagal menyalin teks.");
        }
    } catch (err) {
        alert("Fitur salin tidak didukung pada browser ini.");
    }
    document.body.removeChild(tempTextArea);
}

//======================================
// UNDUH SURAT CUTI SEBAGAI GAMBAR PNG MURNI (BEBAS BLANK 100% & AMAN DARI ERROR)
//======================================
function downloadPDFSuratCuti() {
    var element = document.getElementById("lembarSurat");
    var idCuti = document.getElementById("pdfNoSurat").innerText.replace("Nomor: ", "").trim();
    var filename = "Surat_Permohonan_" + idCuti + ".png"; // Nama File Gambar PNG
    
    // 1. Simpan posisi asli elemen di dalam modal agar bisa dikembalikan nanti
    var parent = element.parentNode;
    var nextSibling = element.nextSibling;
    
    // 2. Simpan style asli
    var originalStyle = element.getAttribute("style");
    
    // Fungsi Pembantu untuk selalu mengembalikan elemen ke posisi semula
    function kembalikanElemenKeModal() {
        element.setAttribute("style", originalStyle);
        if (nextSibling) {
            parent.insertBefore(element, nextSibling);
        } else {
            parent.appendChild(element);
        }
    }
    
    try {
        // 3. Pindahkan elemen langsung ke document.body (di luar modal & bebas dari animasi CSS)
        document.body.appendChild(element);
        
        // Atur style sementara agar nampak jelas, bersih di atas body
        element.style.position = "absolute";
        element.style.top = "0";
        element.style.left = "0";
        element.style.width = "750px";
        element.style.background = "#ffffff";
        element.style.zIndex = "99999";
        
        // Cek apakah library html2canvas tersedia di browser
        if (typeof html2canvas === "undefined") {
            throw new Error("Pustaka cetak gambar (html2canvas) tidak terdeteksi. Silakan muat ulang halaman atau periksa apakah tag script html2canvas sudah terpasang di index.html.");
        }
        
        // 4. Proses render langsung ke GAMBAR PNG menggunakan HTML5 Canvas asli browser
        html2canvas(element, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
        }).then(function(canvas) {
            // Ambil data URL PNG
            var imgData = canvas.toDataURL("image/png");
            
            // A. Unduh PNG secara lokal ke HP/PC
            var link = document.createElement("a");
            link.download = filename;
            link.href = imgData;
            link.click();
            
            // B. Unggah salinan PNG secara background ke Google Drive Folder
            var base64 = imgData.split(',')[1];
            google.script.run
                .withSuccessHandler(function(res) {
                    if (res.success) {
                        console.log("PNG Drive Backup Success: " + res.url);
                    } else {
                        console.error("PNG Drive Backup Failed: " + res.message);
                    }
                })
                .simpanPngKeDrive(base64, filename);
                
            // 5. Kembalikan elemen dan style aslinya ke dalam modal
            kembalikanElemenKeModal();
        }).catch(function(err) {
            console.error("PNG Render Promise Error: ", err);
            kembalikanElemenKeModal();
            alert("Gagal memproses gambar: " + err.message);
        });
        
    } catch (err) {
        console.error("PNG Catch Error: ", err);
        // Penting: Selalu kembalikan elemen agar bayangan di belakang modal hilang
        kembalikanElemenKeModal();
        alert("Sistem gagal cetak: " + err.message);
    }
}

//======================================
// MUAT RIWAYAT CUTI DARI BACKEND
//======================================
function muatRiwayatCuti(nid) {
    google.script.run
        .withSuccessHandler(function(riwayat) {
            var body = document.getElementById("bodyRiwayatCuti");
            var card = document.getElementById("cardRiwayatCuti");
            if (!body || !card) return;
            body.innerHTML = "";
            
            // Simpan ke variable global
            currentRiwayat = riwayat || [];
            
            if (riwayat && riwayat.length > 0) {
                riwayat.forEach(function(row, idx) {
                    var badgeClass = "badge-gray";
                    var label = row.status;
                    
                    if (row.status === "APPROVED") {
                        badgeClass = "badge-green";
                    } else if (row.status === "REJECTED") {
                        badgeClass = "badge-red";
                    } else if (row.status.indexOf("PENDING") !== -1) {
                        badgeClass = "badge-blue";
                        if (row.status === "PENDING ATASAN LANGSUNG") {
                            label = "PENDING TL";
                        } else if (row.status === "PENDING ATASAN TIDAK LANGSUNG") {
                            label = "PENDING ASMAN";
                        }
                    }
                    
                    // PANEL AKSI DINAMIS: Tombol berubah jadi 'Download' (Hijau) jika status APPROVED
                    var btnHtml = "";
                    if (row.status === "APPROVED") {
                        btnHtml = '<button onclick="bukaPreviewDariRiwayat(' + idx + ')" style="background-color: #16a34a; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;"><i class="fa-solid fa-file-arrow-down"></i> Download</button>';
                    } else {
                        btnHtml = '<button onclick="bukaPreviewDariRiwayat(' + idx + ')" style="background-color: var(--tosca); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;"><i class="fa-solid fa-paper-plane"></i> Kirim</button>';
                    }
                    
                    var tr = document.createElement("tr");
                    tr.innerHTML = 
                        '<td style="text-align: left;">' + row.timestamp + '</td>' +
                        '<td style="text-align: left; font-weight:600; color:var(--tosca);">' + row.jenisForm + '</td>' +
                        '<td style="text-align: left;">' + row.tanggalMulai + ' s/d ' + row.tanggalSelesai + '</td>' +
                        '<td style="text-align: center; font-weight:700;">' + row.jumlahHari + ' Hari</td>' +
                        '<td style="text-align: left; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="' + row.alasan + '">' + row.alasan + '</td>' +
                        '<td style="text-align: center;"><span class="pill-badge ' + badgeClass + '">' + label + '</span></td>' +
                        '<td style="text-align: right;">' + btnHtml + '</td>';
                    body.appendChild(tr);
                });
                card.style.display = "block";
            } else {
                body.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding: 25px;">Belum ada riwayat pengajuan cuti/izin.</td></tr>';
                card.style.display = "block";
            }
        })
        .ambilRiwayatCuti(nid);
}

//======================================
// DOWNLOAD PORTFOLIO A4 PDF
//======================================
function downloadPDF() {
    var areaProfil = document.getElementById("profileArea");
    if (!areaProfil || areaProfil.style.display === "none") {
        alert("Cari data karyawan terlebih dahulu sebelum mengunduh PDF.");
        return;
    }

    var btnDownload = document.querySelector(".btn-print");
    if (!btnDownload) return;
    btnDownload.disabled = true;
    btnDownload.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Memproses...";

    // Tambahkan kelas override cetakan
    document.body.classList.add("pdf-generating");

    var elementToPrint = document.getElementById("profileArea");
    var actualHeight = elementToPrint.scrollHeight;

    var opt = {
        margin: 5,
        filename: "Portfolio_Karyawan_" + (globalNid || "Data") + ".pdf",
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
            scale: 2.2,             
            useCORS: true,          // Mengatasi isu CORS pemuatan gambar Drive
            letterRendering: true,
            height: actualHeight,   // Tinggi dinamis agar tidak terpotong ke halaman 2
            windowHeight: actualHeight + 150
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(elementToPrint).save().then(function() {
        document.body.classList.remove("pdf-generating");
        btnDownload.disabled = false;
        btnDownload.innerHTML = "<i class='fa-solid fa-download'></i> Download PDF";
    }).catch(function(error) {
        document.body.classList.remove("pdf-generating");
        btnDownload.disabled = false;
        btnDownload.innerHTML = "<i class='fa-solid fa-download'></i> Download PDF";
        alert("Gagal membuat PDF: " + error);
    });
}
